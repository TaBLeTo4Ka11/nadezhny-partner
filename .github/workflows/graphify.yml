name: Build code knowledge graph

on:
  push:
    branches: [agent/deepseek-dev-assistant]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify-knowledge-index
  cancel-in-progress: true

jobs:
  graphify:
    name: Build and publish local code graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Graphify CLI
        run: python -m pip install --disable-pip-version-check "graphifyy==0.9.103"
      - name: Build code-only graph (no LLM/API key)
        run: graphify extract . --code-only
      - name: Generate graph report and visualization
        run: graphify cluster-only .
      - name: Verify graph outputs
        run: |
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/graph.html
      - name: Upload full graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-knowledge-graph
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.html
          retention-days: 7
      - name: Publish compact graph index to dedicated feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/graphify-index
          cp graphify-out/graph.json graphify-out/GRAPH_REPORT.md /tmp/graphify-index/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/knowledge-graph || true
          if git show-ref --verify --quiet refs/remotes/origin/agent/knowledge-graph; then
            git checkout -B agent/knowledge-graph origin/agent/knowledge-graph
            git clean -fdx
          else
            git checkout --orphan agent/knowledge-graph
            git clean -fdx
          fi
          mkdir -p knowledge-graph
          cp /tmp/graphify-index/graph.json /tmp/graphify-index/GRAPH_REPORT.md knowledge-graph/
          git add knowledge-graph/graph.json knowledge-graph/GRAPH_REPORT.md
          if git diff --cached --quiet; then
            echo "Graph index is unchanged."
          else
            git commit -m "chore: refresh generated Graphify knowledge index"
            git push origin HEAD:refs/heads/agent/knowledge-graph
          fi
