name: Build code knowledge graph

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphify:
    name: Build local code graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Graphify CLI
        run: python -m pip install --disable-pip-version-check "graphifyy==0.9.103"
      - name: Build code-only graph (no LLM/API key)
        run: graphify extract . --code-only
      - name: Verify graph outputs
        run: |
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/graph.html
      - name: Upload graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-knowledge-graph
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.html
          retention-days: 7
