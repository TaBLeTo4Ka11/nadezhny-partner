name: Build check
on:
  push:
    branches: [main, transfer/full-content-redwhite, gpt6/site-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build production site
        run: npm run build
