name: Build check
on:
  push:
    branches: [main, transfer/full-content-redwhite, gpt6/site-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Commit lockfile for reproducible installs
        if: github.ref != 'refs/heads/main'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date"
          else
            git commit -m "build: add reproducible npm lockfile"
            git fetch origin "${BRANCH_NAME}"
            git rebase "origin/${BRANCH_NAME}"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build production site
        run: npm run build
