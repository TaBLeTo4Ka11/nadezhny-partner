name: Build check
on:
  push:
    branches: [main, transfer/full-content-redwhite, gpt6/site-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The build only needs read access. PR code and install scripts must never
# receive a token that can write to repository contents.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build production site
        run: npm run build
